version : 1

formatters:
    standard:
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
    console:
        class : logging.StreamHandler
        stream : ext://sys.stdout
        formatter: standard
    file:
        class : logging.handlers.RotatingFileHandler
        formatter: standard
        filename : f1.log
        maxBytes : 10000000
        backupCount : 3
root:
    level: INFO
    formatter: standard
    handlers: [console]
