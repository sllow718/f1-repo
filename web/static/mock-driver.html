<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driver Telemetry — Mock</title>
<style>
/* F1 webfonts, same files the Flask app uses (web/static/css/). Falls back to
   system faces if opened over file:// in a browser that blocks local fonts. */
@font-face{font-family:'Formula1';src:url('css/formula1-bold_web_0-webfont.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Formula1';src:url('css/formula1-regular_web_0-webfont.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Titillium';src:url('css/titilliumweb-regular-webfont.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Titillium';src:url('css/titilliumweb-bold-webfont.woff2') format('woff2');font-weight:700;font-display:swap}

/* Palette copied from web/static/css/f1sim.css :root — only the values used here. */
:root{
  --carbon:#15151e;
  --bg:#1b1b1b;
  --bg-alt:#3f3f3f;
  --red:#ff1e00;
  --white:#ffffff;
  --green:#22ff08;
  --yellow:#ffff1b;
  --purple:#f700fa;
  --cyan:#21ffff;
  --dim:#8a8a94;
  --num:'Titillium',system-ui,sans-serif;
  --disp:'Formula1','Titillium',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--carbon);color:var(--white);font-family:var(--num)}
/* Full-bleed: spans the viewport and fits its height, so the circuit takes
   whatever room is left rather than the page scrolling. */
body{height:100dvh;overflow:auto}
.dash{width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column}

.panel{padding:14px 18px;border-bottom:1px solid #2a2a33;flex:none;min-width:0}

/* Top half: speedometer. Bottom half split down the middle — circuit left,
   lap data right. Everything sized off the viewport so the whole dash fits
   the screen with no scrolling. */
.head{flex:1;min-height:0}
.bottom{flex:1;display:flex;min-height:0}
.bottom > .panel{flex:1;min-height:0;border-bottom:none;display:flex;flex-direction:column}
.bottom > .panel + .panel{border-left:1px solid #2a2a33}

.lbl{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ---- instrument cluster (top half) ---- */
/* Modern-car cluster: one centred unit with space around it, rather than a row
   of widgets spanning the full width. The content is capped and centred so the
   panel is mostly empty, which is the whole point of the look. Sizes are
   height-driven so the readout grows into a big screen instead of floating as
   a strip in the middle of one. */
.head{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cluster{width:min(1120px,88%);display:flex;flex-direction:column;gap:clamp(18px,4.5vh,54px)}

/* Speed, unit and gear share one baseline, split by a hairline rule. */
.readout{display:flex;align-items:baseline;justify-content:center;gap:clamp(12px,1.6vw,28px)}
/* Both numerals sit in reserved boxes so the row never reflows. The Formula1
   display face has no `tnum` feature — tabular-nums is silently a no-op for it
   (measured: 500.4px with and without) — so its digits are all different
   widths: at the rendered 198px "1" is 125px and "N" is 192px. Left unboxed,
   the gear changed width by up to 67px as it shifted and dragged everything
   after it sideways. `ch` is the width of "0" (191.95px at the speed's 240px,
   70.38px at the gear's 88px), so 3ch exactly covers any three-digit speed —
   "0" is the widest digit and top speed is 320. For the gear, "N" is the
   widest glyph at 85.34px, which is 1.213ch, so 1.25ch covers it; the 1.2ch
   this used to be was measured against the bold face and fell 0.88px short of
   "N" at the regular weight the cluster now uses, which was enough to shift the
   centred row by 0.45px. min-width rather than width so an unexpected wider
   glyph grows the box instead of being clipped. */
.readout .val{font-family:var(--disp);font-weight:400;   /* face ships 400 and 700 only; 400 is the thin one */
  font-size:clamp(64px,24vh,240px);line-height:.85;letter-spacing:-.01em;
  display:inline-block;min-width:3ch;text-align:right}
.readout .unit{font-family:var(--disp);font-size:clamp(12px,1.7vh,19px);letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
.readout .rule{width:1px;align-self:stretch;background:#33333d}
.readout .gear{font-family:var(--disp);font-weight:400;font-size:clamp(28px,9vh,88px);line-height:.85;
  display:inline-block;min-width:1.25ch;text-align:left}

/* Three hairline tracks, labels right-aligned against them. RPM is the primary
   gauge so it is the thicker line; throttle and brake are thinner and coloured,
   which is the telemetry convention and the only colour in the cluster. No
   gradients, no glows, no arcs. */
.gauges{display:flex;flex-direction:column;gap:clamp(9px,1.9vh,20px)}
.g{display:flex;align-items:center;gap:clamp(12px,1.5vw,24px)}
.g .lbl{flex:none;width:3.4em;text-align:right}
.g .track{flex:1;height:2px;background:#2a2a33;border-radius:2px;overflow:hidden}
.g .track > i{display:block;height:100%;width:0;transition:width .06s linear}
.g.rpm .track{height:3px}
#rpmbar{background:var(--white)}
#rpmbar.hot{background:var(--red)}   /* past the redline */
#thrbar{background:var(--green)}
#brkbar{background:var(--red)}

/* ---- lap data ---- */
/* auto-fit: reads across a wide screen as a stat row, stacks down a narrow
   one. A single list stretched over 1800px would put label and value half a
   screen apart; capped at 560px it left two thirds of the panel empty. */
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 24px}
.times .t{font-family:var(--disp);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.times .t.big{font-size:34px}
.times .t.sm{font-size:16px}
.delta{font-size:14px;font-weight:700;margin-left:8px}
.up{color:var(--green)}   /* faster */
.down{color:var(--red)}   /* slower */
.best{color:var(--purple)}

/* ---- circuit map (bottom left) ---- */
.maphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
/* Fills its quarter; preserveAspectRatio="meet" fits the shape inside whatever
   proportions that quarter ends up with. */
#map{display:block;width:100%;flex:1;min-height:0;background:#131318;border-radius:8px}
/* stroke-width is NOT set here: a CSS declaration beats a presentation
   attribute, so putting it here would silently override the value setTrack()
   derives from the path's bounding box — which is the whole point of deriving
   it, since the API's path arrives in whatever units it likes. */
#circuit{fill:none;stroke:#43434f;stroke-linejoin:round;stroke-linecap:round}
/* Sector overlay. The three paths carry the same `d` as #circuit and are cut
   into thirds with stroke-dasharray/dashoffset rather than by splitting the
   path, so the API's geometry is used exactly as delivered and nothing has to
   parse it. dasharray, dashoffset and stroke-width are all set in setTrack(),
   where the real path length is known — deliberately not here, because a CSS
   declaration beats a presentation attribute and would win over those values. */
#sectors .sec{fill:none;stroke-linecap:butt}
#sec1{stroke:var(--cyan)}
#sec2{stroke:var(--yellow)}
#sec3{stroke:var(--purple)}
/* The start/finish bar and the S1/S2/S3 labels are sized in setTrack() too, off
   the same `k` the road uses, so they scale with whatever shape arrives.
   paint-order puts the halo under the glyph, which is what keeps the labels
   legible where they sit on top of a coloured sector. */
#startline{stroke:var(--white);stroke-linecap:butt}
/* dominant-baseline is safe here; text-anchor deliberately is NOT set, because the
   start label has to pick its own per track and a CSS declaration would beat the
   attribute setTrack() writes. Each label sets it explicitly instead — as do the
   turn numbers, which want the same look but their own size. */
.seclbl,.turnlbl{font-family:var(--disp);font-weight:700;fill:var(--white);
  dominant-baseline:middle;paint-order:stroke;stroke:var(--bg);stroke-linejoin:round}
#car{fill:var(--white);stroke:var(--red);stroke-width:3}

.mockbadge{position:fixed;top:8px;right:10px;font-family:var(--disp);font-size:10px;letter-spacing:.14em;
  color:var(--yellow);border:1px solid var(--yellow);border-radius:3px;padding:3px 7px;opacity:.85}
</style>
</head>
<body>

<div class="mockbadge">MOCK DATA</div>

<div class="dash">

  <div class="panel head">
    <div class="cluster">

      <div class="readout">
        <span class="val" id="spd">0</span>
        <span class="unit">km/h</span>
        <span class="rule"></span>
        <span class="gear" id="gear">N</span>
      </div>

      <div class="gauges">
        <div class="g rpm"><span class="lbl">RPM</span>
          <span class="track"><i id="rpmbar"></i></span></div>
        <div class="g thr"><span class="lbl">THR</span>
          <span class="track"><i id="thrbar"></i></span></div>
        <div class="g brk"><span class="lbl">BRK</span>
          <span class="track"><i id="brkbar"></i></span></div>
      </div>

    </div>
  </div>

  <div class="bottom">

    <div class="panel map">
      <div class="maphead">
        <div class="lbl">Circuit &mdash; <span id="trackname">Marina Bay</span></div>
        <div class="lbl"><span id="dist">0</span> m</div>
      </div>
      <svg id="map" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
        <path id="circuit" d=""/>
        <g id="sectors">
          <path class="sec" id="sec1"/>
          <path class="sec" id="sec2"/>
          <path class="sec" id="sec3"/>
        </g>
        <line id="startline" x1="0" y1="0" x2="0" y2="0"/>
        <g id="turnlabels"></g>
        <g id="maplabels">
          <text class="seclbl" id="sec1lbl">S1</text>
          <text class="seclbl" id="sec2lbl">S2</text>
          <text class="seclbl" id="sec3lbl">S3</text>
          <text class="seclbl" id="startlbl">START</text>
        </g>
        <circle id="car" cx="0" cy="0" r="18"/>
      </svg>
    </div>

    <div class="panel">
      <div class="times">
        <div><div class="lbl">Lap</div><div class="t" id="lapnum">1</div></div>
        <div><div class="lbl">Current</div><div class="t big" id="tCur">0:00.000</div></div>
        <div><div class="lbl">Last</div>
          <div><span class="t" id="tLast">--:--.---</span><span class="delta" id="dLast"></span></div></div>
        <div><div class="lbl">Best</div><div class="t best" id="tBest">--:--.---</div></div>
        <div><div class="lbl">S1 / S2 / S3</div><div class="t sm" id="tSec">- / - / -</div></div>
      </div>
    </div>

  </div>

</div>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 * Marina Bay (Singapore) — the configured hometrack.
 * Corner apex: d = metres around the lap, v = apex speed km/h,
 * s = sharpness 1..3, dir = +1 right / -1 left.
 * ------------------------------------------------------------------ */
const LAP_LEN = 4940;
const CORNERS = [
  { d:  150, v:  95, s:3, dir: 1 },   // T1  heavy braking
  { d:  275, v: 132, s:2, dir: 1 },   // T2
  { d:  400, v: 110, s:2, dir:-1 },   // T3
  { d:  575, v: 148, s:2, dir: 1 },   // T4
  { d:  720, v: 122, s:2, dir:-1 },   // T5
  { d:  890, v: 205, s:1, dir: 1 },   // T6  fast
  { d: 1055, v: 104, s:3, dir:-1 },   // T7
  { d: 1195, v: 152, s:2, dir: 1 },   // T8
  { d: 1360, v:  92, s:3, dir: 1 },   // T9
  { d: 1570, v: 128, s:2, dir:-1 },   // T10
  { d: 1760, v: 101, s:3, dir: 1 },   // T11
  { d: 1990, v: 162, s:2, dir:-1 },   // T12
  { d: 2215, v:  86, s:3, dir: 1 },   // T13 hairpin
  { d: 2460, v: 142, s:2, dir:-1 },   // T14
  { d: 2690, v: 116, s:2, dir: 1 },   // T15
  { d: 2910, v: 178, s:1, dir:-1 },   // T16
  { d: 3160, v:  96, s:3, dir: 1 },   // T17
  { d: 3410, v: 156, s:2, dir:-1 },   // T18
  { d: 3705, v: 131, s:2, dir: 1 },   // T19  -> long run to the line
];

const DS      = 5;              // profile resolution, metres
const N       = Math.round(LAP_LEN / DS);
const V_MAX   = 320 / 3.6;      // m/s
const A_BRAKE = 32;             // m/s^2
const A_ACCEL = 11;             // m/s^2
const GEARS   = [0, 60, 95, 130, 170, 210, 250, 285];   // lower bound km/h per gear

/* Acceleration is not constant in reality — it is traction-limited at low
   speed and power/drag-limited at high speed, so it tails off to nothing as
   the car approaches V_MAX. Without this the car would sit pinned at V_MAX
   for the whole main straight with the throttle reading zero. */
const accelLimit = v => A_ACCEL * Math.max(0, 1 - (v / V_MAX) ** 2);

/* ------------------------------------------------------------------ *
 * Lap profile — solved once at load.
 * Start everything at V_MAX, clamp the apexes, then relax backwards for
 * braking and forwards for traction. Two passes so the wrap-around
 * (last corner -> start/finish straight) converges.
 * Every displayed value is a consequence of this one array, which is
 * why the numbers can never contradict each other.
 * ------------------------------------------------------------------ */
function buildProfile() {
  const v = new Float64Array(N).fill(V_MAX);

  for (const c of CORNERS) {
    const apex = c.v / 3.6;
    const i = Math.round(c.d / DS) % N;
    for (let k = -3; k <= 3; k++) {            // small plateau, not a spike
      const j = (i + k + N) % N;
      v[j] = Math.min(v[j], apex + Math.abs(k) * 1.2);
    }
  }
  for (let pass = 0; pass < 2; pass++) {
    for (let i = N - 1; i >= 0; i--) {         // braking: backwards from each apex
      const nx = v[(i + 1) % N];
      v[i] = Math.min(v[i], Math.sqrt(nx * nx + 2 * A_BRAKE * DS));
    }
    for (let i = 0; i < N; i++) {              // traction: forwards out of each apex
      const pv = v[(i - 1 + N) % N];
      v[i] = Math.min(v[i], Math.sqrt(pv * pv + 2 * accelLimit(pv) * DS));
    }
  }
  return v;
}

/* Steering is drawn from corner proximity rather than derived from the
   speed profile — cheap, and it puts the wheel input in the right place. */
function buildSteer() {
  const s = new Float64Array(N);
  const sigma = 70;
  for (const c of CORNERS) {
    const ci = c.d / DS;
    for (let i = 0; i < N; i++) {
      let dd = (i - ci) * DS;
      if (dd >  LAP_LEN / 2) dd -= LAP_LEN;
      if (dd < -LAP_LEN / 2) dd += LAP_LEN;
      s[i] += c.dir * (c.s / 3) * Math.exp(-(dd * dd) / (2 * sigma * sigma));
    }
  }
  for (let i = 0; i < N; i++) s[i] = Math.max(-1, Math.min(1, s[i]));
  return s;
}

const V = buildProfile();
const STEER = buildSteer();

/* Lap time the profile implies. ~1:33 at Singapore, which is about right. */
const LAP_TIME_MS = Math.round(V.reduce((a, v, i) => a + DS / v, 0) * 1000);

/* ------------------------------------------------------------------ */
const idx      = d => Math.floor(((d % LAP_LEN) + LAP_LEN) % LAP_LEN / DS);
const lerp     = (a, b, t) => a + (b - a) * t;
function speedAt(d) {                     // m/s, linearly interpolated
  const x = ((d % LAP_LEN) + LAP_LEN) % LAP_LEN / DS;
  const i = Math.floor(x), t = x - i;
  return lerp(V[i % N], V[(i + 1) % N], t);
}
function accelAt(d) {                     // m/s^2, from the profile itself
  const a = speedAt(d), b = speedAt(d + DS);
  return (b * b - a * a) / (2 * DS);
}

const fmt = ms => {
  if (ms == null) return '--:--.---';
  const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), r = Math.floor(ms % 1000);
  return m + ':' + String(s).padStart(2, '0') + '.' + String(r).padStart(3, '0');
};
const fmtSec = ms => ms == null ? '-' : (ms / 1000).toFixed(3);

/* ---- state ---- */
let dist = 0, lapMs = 0, lapNum = 1;
let lastLap = null, bestLap = null, prevSec = [null, null, null], sec = [null, null, null];

function reset() {
  dist = 0; lapMs = 0; lapNum = 1;
  lastLap = bestLap = null; prevSec = [null, null, null]; sec = [null, null, null];
}

function completeLap() {
  lastLap = lapMs;
  if (bestLap == null || lastLap < bestLap) bestLap = lastLap;
  prevSec = sec.slice();
  sec = [null, null, null];
  lapNum++; lapMs = 0;
}

/* ------------------------------------------------------------------ *
 * Every value the dashboard shows, derived from position alone.
 * Kept as one function so the self-check asserts on exactly what the
 * screen renders rather than a re-implementation of it.
 * ------------------------------------------------------------------ */
function sample(d) {
  const v   = speedAt(d);
  const a   = accelAt(d);
  const st  = STEER[idx(d)];
  const spd = v * 3.6;

  // Throttle is the pedal, not the net force. Once the car is drag-limited
  // (accelLimit -> 0) the driver still holds it pinned, so scale by the
  // limit rather than by the constant.
  const aLim     = accelLimit(v);
  const brake    = a < -0.2 ? Math.min(1, -a / A_BRAKE) : 0;
  const throttle = brake > 0 ? 0
                 : aLim < 0.5 ? 1
                 : Math.max(0, Math.min(1, a / aLim));

  // gear + rpm from speed
  let g = 1;
  for (let i = 0; i < GEARS.length; i++) if (spd >= GEARS[i]) g = i + 1;
  const lo = GEARS[g - 1], hi = g < 8 ? GEARS[g] : 330;
  const frac = Math.max(0, Math.min(1, (spd - lo) / (hi - lo)));
  const rpm  = 9000 + 6000 * frac;

  // Lateral g from cornering. Nothing on screen shows it any more, but the
  // self-check asserts it stays physical, so the steering model is still
  // covered. a/9.81 (longitudinal) had no reader left and was dropped.
  const latG = st * (v / V_MAX) ** 2 * 4.6;

  return { v, a, spd, g, rpm, throttle, brake, st, latG };
}

/* ---- one physics tick ---- */
function step(dt) {
  const prev = dist;
  const v = speedAt(dist);

  dist += v * dt;
  lapMs += dt * 1000;
  if (dist >= LAP_LEN) { completeLap(); dist -= LAP_LEN; }

  // sector splits, at the 1/3 and 2/3 marks
  const marks = [LAP_LEN / 3, 2 * LAP_LEN / 3];
  for (let i = 0; i < 2; i++) {
    if (sec[i] == null && prev < marks[i] && dist >= marks[i]) {
      sec[i] = i === 0 ? lapMs : lapMs - sec[0];
    }
  }

  return sample(dist);
}

/* ---- render ---- */
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ *
 * Circuit map — where the car is on the lap.
 *
 * The real dashboard (js/telemetrySVG.js) places its car straight from the
 * packet's world coordinates: rot(m_worldPosX, m_worldPosY), because its
 * path and the world position share a coordinate space. This mock has no
 * world coordinates, so the dot is placed by ARC LENGTH instead —
 * getPointAtLength() walks the path for us, and the fraction walked is
 * dist/LAP_LEN. The dot and the speed readout therefore both come from
 * `dist` and cannot drift apart.
 *
 * Same trackmap endpoint js/trackmap_svg.js calls. If the fetch fails
 * (offline Pi) the inline path below is kept, so the panel never renders
 * empty; both routes share every line of positioning code.
 * ------------------------------------------------------------------ */
const TRACK_API = 'https://apigw.withoracle.cloud/livelaps/trackmap/Singapore/2022';
const TRACK_NAME = 'Singapore';

/* The real Marina Bay shape, baked in. This began as a hand-drawn stand-in and
   every refresh showed that sketch for a second or more while TRACK_API answered
   over the internet, so the page always opened on the wrong circuit and then
   jumped. It is now the exact string the API serves for Singapore/2022, so the
   swap on arrival is a byte-for-byte no-op and nothing moves. It also means the
   offline Pi case draws the true track rather than an approximation whose
   corners did not line up with CORNERS above.
   To regenerate: fetch TRACK_API and replace this literal. It is data, not
   something to hand-edit — a typo'd coordinate is invisible until you look. */
const TRACK_D =
  'M 716.05 63.43 L 714.75 53.16 L 713.75 45.16 L 712.4 34.46 L 711.41 26.79 L 709.99 15.75 L ' +
  '708.88 7.19 L 707.38 -4.16 L 706.12 -13.64 L 704.53 -25.29 L 701.99 -43.35 L 698.9 -65.27 L ' +
  '697.29 -76.67 L 695.9 -86.59 L 694.34 -97.67 L 692.9 -107.96 L 691.66 -116.84 L 690.17 ' +
  '-127.49 L 688.79 -137.37 L 687.35 -147.72 L 686.02 -157.34 L 684.62 -167.41 L 683.56 -175.03 ' +
  'L 682.27 -184.36 L 681.22 -192.01 L 679.83 -202.1 L 678.76 -209.89 L 677.35 -220.17 L 676.26 ' +
  '-228.09 L 674.83 -238.53 L 673.73 -246.58 L 672.28 -257.18 L 671.08 -265.97 L 669.62 -276.72 ' +
  'L 668.43 -285.51 L 667.14 -294.97 L 666.1 -302.7 L 664.98 -310.98 L 664.15 -317.11 L 663.22 ' +
  '-324 L 662.31 -330.71 L 661.95 -333.4 L 661.43 -337.24 L 660.75 -342.19 L 660.23 -345.92 L ' +
  '659.49 -350.72 L 658.76 -354.59 L 656.71 -361.42 L 654.91 -365.02 L 652.95 -367.84 L 650.02 ' +
  '-370.76 L 646.63 -372.95 L 642.47 -374.46 L 638.64 -374.97 L 634.63 -374.95 L 630.67 -374.8 ' +
  'L 626.64 -374.71 L 622.41 -374.76 L 618.99 -374.95 L 614.84 -375.38 L 604.8 -377.31 L 599.71 ' +
  '-378.9 L 594.71 -380.91 L 590.12 -383.2 L 581.8 -388.59 L 577.3 -392.32 L 572.99 -396.52 L ' +
  '566.53 -404.17 L 560.1 -412.46 L 553.22 -419.49 L 544.86 -424.67 L 535.35 -427.17 L 526.18 ' +
  '-426.68 L 518.27 -423.43 L 512.06 -417.65 L 508.45 -410.5 L 507.16 -405.79 L 506.24 -401.37 ' +
  'L 504.65 -391.94 L 503.2 -380.94 L 501.77 -368.41 L 500.62 -355.96 L 500.12 -348.96 L 499.78 ' +
  '-341.91 L 499.67 -334.34 L 499.95 -326.69 L 500.47 -320.74 L 501.54 -313.35 L 503.26 -305.48 ' +
  'L 505.6 -297.69 L 507.05 -293.61 L 510.04 -285.95 L 512.42 -280.1 L 515.52 -272.29 L 517.79 ' +

const boxGap = (a, b) => Math.hypot(Math.max(a.x0 - b.x1, 0, b.x0 - a.x1),
                                    Math.max(a.y0 - b.y1, 0, b.y0 - a.y1));

   taken at an even stride through the lap. The shape arrives from the API, so
   what sits next to a label is not knowable up front — it has to be measured. */
function boxRoadGap(box, n) {
  let d = Infinity;
  const stride = lapPts.length / n;
  for (let i = 0; i < n; i++) {
    const p = lapPts[(i * stride) | 0];
    d = Math.min(d, Math.hypot(Math.max(box.x0 - p.x, 0, p.x - box.x1),

    el.setAttribute('text-anchor', 'middle');
    el.setAttribute('font-size', tfs.toFixed(1));
    el.setAttribute('stroke-width', (k * 0.009).toFixed(1));   // halo
    el.textContent = txt;
    turnG.appendChild(el);
  }

  // --- sectors and their labels ---
  // A third of the lap per sector. Each sector path is the same `d` as the road
  // with one dash a third long followed by a gap covering the rest of the lap,
  // pushed along by its own negative offset. That paints exactly [i*seg,
  // (i+1)*seg] per path without splitting or re-parsing the path data.
  const seg = circuitLen / 3;
  for (let i = 0; i < 3; i++) {
    const p = secPaths[i];
    p.setAttribute('d', d);
    p.setAttribute('stroke-width', road.toFixed(1));
    p.setAttribute('stroke-dasharray', seg.toFixed(2) + ' ' + circuitLen.toFixed(2));
    p.setAttribute('stroke-dashoffset', (-i * seg).toFixed(2));
  }

  // The sector labels belong BESIDE the circuit, and getting them there is the
  // whole of this block. Two things made the obvious approach fail. The label
  // midpoint is not a considered position — a third of the lap is 1700 units of
  // road and the label lands wherever the halfway point happens to be; measured
  // on this shape that put S2 on T10 and S3 on T18, the T18 one covering the
  // number outright. And stepping straight out from a midpoint does not work
  // either, because the lap doubles back: S1 is walled in on its own normal and
  // S2's midpoint needs 350 units before it finds air.
  //
  // So the label slides. Eight anchors across its own sector, the road's normal
  // at each, a fan either side of that normal, and a distance sweep — a few
  // thousand boxes, all scored against the road, the 23 turn numbers and the
  // labels already placed. The NEAREST spot clearing everything by k*0.05 wins,
  // because a sector label that has wandered across the map stops naming
  // anything; and the clearance floor is what puts it off the tarmac rather
  // than merely off the numbers, which is the difference the user could see.
  // Anchors stay within 15%-85% of the sector so a label cannot drift into the
  // third next door and start lying about which sector it is.
  const sfs = k * 0.062, want = k * 0.050;
  const sw = 3 * sfs * 0.8, ins = k * 0.012;
  const placed = [];
  for (let i = 0; i < 3; i++) {
    const lbl = secLabels[i];
    const mid = circuit.getPointAtLength((i + 0.5) * seg);
    let lx = mid.x, ly = mid.y, best = null, fallback = null;
    for (let a = 0.15; a <= 0.851; a += 0.10) {
      const ln = (i + a) * seg, at = circuit.getPointAtLength(ln), tn = tangentAt(ln);
      for (let sgn = 0; sgn < 2; sgn++) {           // the road has two sides
        const nx = sgn ? tn.y : -tn.y, ny = sgn ? -tn.x : tn.x;
        for (let o = -40; o <= 40; o += 20) {       // a fan around the normal
          const th = o * Math.PI / 180, co = Math.cos(th), si = Math.sin(th);
          const ux = nx * co - ny * si, uy = nx * si + ny * co;
          for (let r = k * 0.04; r <= k * 0.28; r += k * 0.010) {
            const px = at.x + ux * r, py = at.y + uy * r;
            const cand = { x0: px - sw / 2, x1: px + sw / 2, y0: py - sfs / 2, y1: py + sfs / 2 };
            // Inside the padded panel. Past its edge the label is outside the
            // viewBox and gets clipped, which is worse than a cramped one.
            if (cand.x0 < b.x - pad + ins || cand.x1 > b.x + b.width + pad - ins ||
                cand.y0 < b.y - pad + ins || cand.y1 > b.y + b.height + pad - ins) continue;
            let d = boxRoadGap(cand, 90);           // the road it is labelling included
            for (const tb of turnBoxes) d = Math.min(d, boxGap(cand, tb));
            for (const pb of placed) d = Math.min(d, boxGap(cand, pb));
            if (!fallback || d > fallback.d) fallback = { px, py, d };
            if (d <= want) continue;
            // Nearest wins; at equal distance the roomier of the two does.
            if (!best || r < best.r - 0.5 || (Math.abs(r - best.r) <= 0.5 && d > best.d))
              best = { px, py, r, d };
          }
        }
      }
    }
    // On a shape with nowhere legal the label still moves to the roomiest spot
    // found rather than back onto the road — a cramped label beats an overlapped
    // one. Only a panel too small for any candidate at all leaves it at the
    // midpoint.
    const pick = best || fallback;
    if (pick) { lx = pick.px; ly = pick.py; }
    placed.push({ x0: lx - sw / 2, x1: lx + sw / 2, y0: ly - sfs / 2, y1: ly + sfs / 2 });

    lbl.setAttribute('x', lx.toFixed(2));
    lbl.setAttribute('y', ly.toFixed(2));
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', sfs.toFixed(1));
    lbl.setAttribute('stroke-width', (k * 0.014).toFixed(1));   // halo
  }

  // Start/finish: a white bar stood across the road at lap zero. Sized as a
  // fraction of the road so it scales with the shape, and long enough to poke
  // past both kerbs — at road*0.8 x road*0.45 it rendered 26x7 CSS px, which is
  // a real tick but too easy to miss for the one marker that matters most.
  const s = circuit.getPointAtLength(0), t = tangentAt(0);
  const nx = -t.y, ny = t.x, half = road * 0.95;
  startLine.setAttribute('x1', (s.x - nx * half).toFixed(2));
  startLine.setAttribute('y1', (s.y - ny * half).toFixed(2));
  startLine.setAttribute('x2', (s.x + nx * half).toFixed(2));
  startLine.setAttribute('y2', (s.y + ny * half).toFixed(2));
  startLine.setAttribute('stroke-width', (road * 0.6).toFixed(1));

  // Label the start/finish bar. Where the text can sit has to be measured, not
  // assumed: the shape arrives from the API, so nothing about the neighbourhood
  // is knowable up front. Singapore's start point is walled in — cyan above,
  // magenta below, the bar across the road, and only 27 units of gap to its
  // right — and every fixed offset put "START" either off the panel or straight
  // through the bar it names. So try eight directions around the bar tip and
  // keep whichever text box clears the road by the most. The width is a
  // character count against this face's own metrics, which are wide: "0" is
  // .80em and "N" is .97em, so .8em per character is the honest estimate. The
  // self-check asserts the chosen box really does clear the bar.
  const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
  const fs = k * 0.038, w = startLabel.textContent.length * fs * 0.8;
  const reach = half + fs * 0.7, bx0 = b.x - pad, by0 = b.y - pad;
  const bx1 = b.x + b.width + pad, by1 = b.y + b.height + pad;
  let lx = s.x, ly = s.y, anch = 'middle', best = -1;
  for (let a = 0; a < 8; a++) {
    const th = a * Math.PI / 4, dx = Math.cos(th), dy = Math.sin(th);
    const px = s.x + dx * reach, py = s.y + dy * reach;
    const x0 = dx >= 0 ? px : px - w, x1 = dx >= 0 ? px + w : px;
    const y0 = py - fs / 2, y1 = py + fs / 2;
    if (x0 < bx0 || x1 > bx1 || y0 < by0 || y1 > by1) continue;   // would run off the panel
    const cand = { x0, x1, y0, y1 };
    let d = boxRoadGap(cand, 90);
    for (const tb of turnBoxes) d = Math.min(d, boxGap(cand, tb));
    if (d > best) { best = d; lx = px; ly = py; anch = dx >= 0 ? 'start' : 'end'; }
  }
  if (best < 0) {   // every direction left the panel — clamp an outward nudge instead
    const ox = s.x - cx, oy = s.y - cy, om = Math.hypot(ox, oy) || 1;
    lx = Math.min(Math.max(s.x + ox / om * k * 0.055, bx0 + road), bx1 - road);
    ly = Math.min(Math.max(s.y + oy / om * k * 0.055, by0 + road), by1 - road);
    anch = lx > cx ? 'end' : 'start';
  }
  startLabel.setAttribute('x', lx.toFixed(2));
  startLabel.setAttribute('y', ly.toFixed(2));
  startLabel.setAttribute('text-anchor', anch);
  startLabel.setAttribute('font-size', fs.toFixed(1));
  startLabel.setAttribute('stroke-width', (k * 0.011).toFixed(1));
}

/* Install a path, falling back to the known-good shape if the fetched one
   will not parse. A throw here would take the render loop down with it. */
function useTrack(d) {
  try { setTrack(d); return true; }
  catch (e) { setTrack(TRACK_D); return false; }
}

if (canPath) {
  setTrack(TRACK_D);
  fetch(TRACK_API, { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const d = j && j.TRACK_SVG, td = j && j.TURNDATA;
      if (Array.isArray(td) && td.length) curTurns = td.map(t => [+t.APEX_X1, +t.APEX_Y1]);
      if (typeof d === 'string' && /^\s*[Mm]/.test(d) && useTrack(d)) {
        $('trackname').textContent = (j.TRACK_DETAIL && j.TRACK_DETAIL.TRACK) || TRACK_NAME;
        // The self-check ran against the fallback before this resolved, so
        // validate again now the real geometry is in.
        if (wantCheck()) selfCheck();
      }
    })
    .catch(() => {});        // offline: keep the fallback shape
}

/* Lap fraction (0..1) -> point on the circuit. */
function trackPoint(frac) {
  if (!circuitLen) return null;
  const f = ((frac % 1) + 1) % 1;
  const p = circuit.getPointAtLength(f * circuitLen);
  return { x: +p.x.toFixed(2), y: +p.y.toFixed(2) };
}

function render(s) {
  $('spd').textContent  = Math.round(s.spd);
  $('gear').textContent = s.g;
  // rpm runs 9000-15000, so the track is scaled against 15000 and never sits
  // empty — which is right, that is the real idle for this engine.
  $('rpmbar').style.width = (s.rpm / 15000 * 100) + '%';
  $('rpmbar').classList.toggle('hot', s.rpm > 13000);
  $('thrbar').style.width = (s.throttle * 100) + '%';
  $('brkbar').style.width = (s.brake * 100) + '%';

  $('lapnum').textContent = lapNum;
  $('tCur').textContent   = fmt(lapMs);
  $('tLast').textContent  = fmt(lastLap);
  $('tBest').textContent  = fmt(bestLap);
  $('tSec').textContent   = sec.map(fmtSec).join(' / ');

  // car position on the circuit, straight from where it is around the lap
  $('dist').textContent = Math.round(dist);
  const p = trackPoint(dist / LAP_LEN);
  if (p) { carDot.setAttribute('cx', p.x); carDot.setAttribute('cy', p.y); }

  const d = $('dLast');
  if (lastLap != null && bestLap != null) {
    if (lastLap === bestLap) { d.textContent = 'BEST'; d.className = 'delta best'; }
    else {
      const diff = lastLap - bestLap;
      d.textContent = (diff > 0 ? '+' : '-') + (Math.abs(diff) / 1000).toFixed(3);
      d.className = 'delta ' + (diff > 0 ? 'down' : 'up');
    }
  } else { d.textContent = ''; d.className = 'delta'; }
}

/* ---- loop (fixed step, so the simulation is frame-rate independent) ---- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  let s = null;
  while (acc >= STEP) { s = step(STEP); acc -= STEP; }
  if (s) render(s);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ *
 * Self-check: ?selfcheck=1
 * Verifies the profile is self-consistent — the thing that can actually
 * break is the braking/traction relaxation. No framework, just asserts.
 * ------------------------------------------------------------------ */
function selfCheck() {
  const log = [], ok = (name, cond) => { log.push((cond ? 'PASS  ' : 'FAIL  ') + name); return cond; };
  let pass = true;

  pass &= ok('profile length = ' + N, V.length === N);
  pass &= ok('lap time sane (' + fmt(LAP_TIME_MS) + ')', LAP_TIME_MS > 85000 && LAP_TIME_MS < 105000);
  pass &= ok('never exceeds V_MAX', V.every(v => v <= V_MAX + 1e-9));
  pass &= ok('never stalls', V.every(v => v > 20 / 3.6));
  pass &= ok('step between samples is finite', V.every(v => Number.isFinite(v)));

  let worstBrake = 0, worstAccel = 0;
  for (let i = 0; i < N; i++) {
    const a = (V[(i + 1) % N] ** 2 - V[i] ** 2) / (2 * DS);
    worstBrake = Math.min(worstBrake, a);
    worstAccel = Math.max(worstAccel, a);
  }
  pass &= ok('braking never exceeds A_BRAKE (' + worstBrake.toFixed(1) + ')', worstBrake >= -A_BRAKE - 0.5);
  pass &= ok('traction never exceeds A_ACCEL (' + worstAccel.toFixed(1) + ')', worstAccel <= A_ACCEL + 0.5);

  // Apex speeds are actually reached: the profile should dip near each apex.
  let reached = 0;
  for (const c of CORNERS) {
    const i = Math.round(c.d / DS) % N;
    if (speedAt(i * DS) * 3.6 <= c.v + 8) reached++;
  }
  pass &= ok('all ' + CORNERS.length + ' apexes reachable (got ' + reached + ')', reached === CORNERS.length);

  // Coherence of the values the dashboard actually renders.
  const straight = sample(4600);              // run to the line
  pass &= ok('main straight: throttle pinned (' + straight.throttle.toFixed(2) + ')', straight.throttle > 0.9);
  pass &= ok('main straight: no brake', straight.brake === 0);
  pass &= ok('main straight: top gear', straight.g === 8);

  const hairpin = sample(2215);               // T13
  pass &= ok('hairpin: below 100 km/h (' + hairpin.spd.toFixed(0) + ')', hairpin.spd < 100);
  pass &= ok('hairpin: low gear (' + hairpin.g + ')', hairpin.g <= 3);

  // Sweep the lap: no impossible combinations anywhere.
  let both = 0, maxLat = 0, gears = new Set(), minSpd = Infinity;
  for (let d = 0; d < LAP_LEN; d += DS) {
    const s = sample(d);
    if (s.throttle > 0.05 && s.brake > 0.05) both++;
    maxLat = Math.max(maxLat, Math.abs(s.latG));
    minSpd = Math.min(minSpd, s.spd);
    gears.add(s.g);
  }
  pass &= ok('never on throttle and brake together', both === 0);
  pass &= ok('lateral g stays physical (' + maxLat.toFixed(1) + 'g)', maxLat < 5.5);
  pass &= ok('never stops on track (' + minSpd.toFixed(0) + ' km/h)', minSpd > 60);

  // 1st is deliberately not expected: on a flying lap the slowest point is the
  // T13 hairpin at ~86 km/h, a 2nd-gear corner. Anything using 1st would mean
  // the lap had gone wrong.
  const missing = [];
  for (let g = 2; g <= 8; g++) if (!gears.has(g)) missing.push(g);
  pass &= ok('gears 2-8 all used' + (missing.length ? ' (missing ' + missing + ')' : ''),
             missing.length === 0);

  // Circuit map. The dot is placed by arc length, so a lap must close back on
  // itself and the car must actually travel around the shape rather than sit
  // on one spot while the speed readout moves.
  if (!canPath) {
    pass &= ok('circuit: SVG getPointAtLength available', false);
  } else {
    pass &= ok('circuit geometry resolved (' + circuitLen.toFixed(0) + ' units)', circuitLen > 0);

    const p0 = trackPoint(0), p1 = trackPoint(1), pm = trackPoint(0.5);
    const gap = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    pass &= ok('lap closes on the map (gap ' + gap.toFixed(2) + ')', gap < 1);
    pass &= ok('halfway round is elsewhere on the map',
               Math.hypot(pm.x - p0.x, pm.y - p0.y) > 1);

    const bb = circuit.getBBox();
    let outside = 0, frozen = 0, prev = p0;
    for (let d = DS; d <= LAP_LEN; d += DS) {
      const q = trackPoint(d / LAP_LEN);
      if (!q || q.x < bb.x || q.x > bb.x + bb.width ||
                q.y < bb.y || q.y > bb.y + bb.height) outside++;
      if (q) {
        if (Math.hypot(q.x - prev.x, q.y - prev.y) < 1e-6) frozen++;
        prev = q;
      }
    }
    pass &= ok('dot never leaves the circuit bounds', outside === 0);
    pass &= ok('dot never freezes (' + frozen + ' stalled samples)', frozen === 0);

    // The sector overlay is drawn from dash maths rather than from split paths,
    // so the thing that can silently break is a gap or overlap at a boundary.
    // Assert each sector starts exactly a third further along than the last and
    // that all three still carry the live path data.
    const seg = circuitLen / 3;
    const tile = secPaths.every((p, i) => {
      const da = String(p.getAttribute('stroke-dasharray') || '').trim().split(/\s+/).map(Number);
      const off = Number(p.getAttribute('stroke-dashoffset'));
      return Math.abs(da[0] - seg) < 0.5 && Math.abs(da[1] - circuitLen) < 0.5 &&
             Math.abs(-off - i * seg) < 0.5 && p.getAttribute('d') === circuit.getAttribute('d');
    });
    pass &= ok('3 sectors tile the lap exactly (' + seg.toFixed(0) + ' units each)', tile);

    const lblBox = el => {
      const fs = Number(el.getAttribute('font-size')) || 0;
      const w = (el.textContent || '').length * fs * 0.8;
      const x = Number(el.getAttribute('x')), y = Number(el.getAttribute('y'));
      return { x0: x - w / 2, x1: x + w / 2, y0: y - fs / 2, y1: y + fs / 2, t: el.textContent };
    };
    const bGap = (a, b) => Math.hypot(Math.max(a.x0 - b.x1, 0, b.x0 - a.x1),
                                      Math.max(a.y0 - b.y1, 0, b.y0 - a.y1));

    // Labels are positioned from getPointAtLength, so a NaN would put S1/S2/S3
    // somewhere meaningless. Containment in the path's own bbox is deliberately
    // NOT asserted any more — the labels are placed off the circuit on purpose,
    // which is the point of the search above. What still matters is the viewBox,
    // because past its edge a label is clipped: checked as the whole text box
    // rather than the anchor, since a box half over the edge is a clipped label.
    const vb = String(svgMap.getAttribute('viewBox') || '').trim().split(/\s+/).map(Number);
    const offPanel = secLabels.map(lblBox).filter(bx =>
      !Number.isFinite(bx.x0) || bx.x0 < vb[0] || bx.x1 > vb[0] + vb[2] ||
      bx.y0 < vb[1] || bx.y1 > vb[1] + vb[3]);
    pass &= ok('sector labels fit inside the panel' +
               (offPanel.length ? ' (' + offPanel.length + ' clipped)' : ''), offPanel.length === 0);

    // The complaint that prompted all of this was labels sitting on the racing
    // line, and nothing below catches it: a label parked between two numbers is
    // clear of both and still on the tarmac. So measure the thing the user
    // actually saw. The floor is a quarter of the label's own width — for this
    // shape the search achieves k*0.05 or better, so this has real headroom and
    // still fails loudly if placement ever regresses to the midpoint.
    let tightest = Infinity, tightAt = '';
    secLabels.map(lblBox).forEach((bx, i) => {
      const g = boxRoadGap(bx, 90);
      if (g < tightest) { tightest = g; tightAt = ' (S' + (i + 1) + ')'; }
    });
    pass &= ok('sector labels stand off the road, closest ' + tightest.toFixed(0) + ' units' + tightAt,
               tightest > Math.max(bb.width, bb.height) * 0.04);

    // Turn numbers. Two failures are worth catching. A stale set: setTrack
    // rebuilds the group every call, so a build that forgot to clear would leave
    // the baked numbers sitting under the fetched ones. And a covered glyph: the
    // numbers and the sector labels are placed independently of each other, so
    // nothing but this assertion notices when one lands on the other — which is
    // exactly the bug that prompted the placement search. The boxes are rebuilt
    // from each element's own attributes rather than from the placement code, so
    // this checks the result rather than re-running the same arithmetic.
    // Containment is deliberately not asserted — a number stood off the road can
    // legitimately poke out of the path's own bbox.
    const turnEls = Array.from(turnG.children);
    pass &= ok(turnEls.length + ' turn numbers placed',
               turnEls.length > 0 && turnEls.length === curTurns.length &&
               turnEls.every(el => Number.isFinite(Number(el.getAttribute('x'))) &&
                                   Number.isFinite(Number(el.getAttribute('y')))));

    // Every label on the map against every other: numbers vs sector labels, and
    // the sector labels against each other, since those are now placed by a
    // search that only sees the ones already down and a bad ordering could still
    // stack two of them.
    const secBoxes = secLabels.map(lblBox);
    let worst = Infinity, worstAt = '';
    const note = (g, what) => { if (g < worst) { worst = g; worstAt = what; } };
    for (const t of turnEls.map(lblBox))
      for (const s of secBoxes)
        note(bGap(t, s), ' (T' + t.t + '/S' + (s.t || '?').slice(1) + ')');
    for (let i = 0; i < secBoxes.length; i++)
      for (let j = i + 1; j < secBoxes.length; j++)
        note(bGap(secBoxes[i], secBoxes[j]), ' (S' + (i + 1) + '/S' + (j + 1) + ')');
    pass &= ok('labels stay clear of each other, closest ' + worst.toFixed(0) + ' units' + worstAt,
               worst > 0);

    // The START label is the one that broke: its anchor is now chosen by search,
    // and a search that finds nothing falls back to a clamped nudge. Both paths
    // must land inside the viewBox — an anchor outside it is clipped, which is
    // exactly how this was first noticed ("START" rendering as "STAR"). Tested
    // against the viewBox edge itself, not an invented margin, because the box
    // the search fits is the bbox plus pad and an anchor may legitimately sit on
    // that boundary.
    const lx = Number(startLabel.getAttribute('x')), ly = Number(startLabel.getAttribute('y'));
    const inVB = vb.length === 4 && vb.every(Number.isFinite) &&
                 Number.isFinite(lx) && Number.isFinite(ly) &&
                 lx >= vb[0] && lx <= vb[0] + vb[2] &&
                 ly >= vb[1] && ly <= vb[1] + vb[3];
    pass &= ok('START label anchor lands inside the viewBox', inVB);
  }

  console.log('%cDriver mock self-check', 'font-weight:bold');
  console.log(log.join('\n'));
  console.log(pass ? '%cALL PASS' : '%cFAILURES ABOVE', 'color:' + (pass ? 'green' : 'red'));
  if (!pass) document.querySelector('.mockbadge').textContent = 'SELF-CHECK FAILED';
  return pass;
}

function wantCheck() {
  return new URLSearchParams(location.search).get('selfcheck') === '1';
}

if (wantCheck()) selfCheck();

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
