<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    {% block styles %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- Sweet alert Js -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'css/f1sim.css') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <link rel="icon" href="{{ url_for('static', filename= 'images/favicon.ico') }}" type="image/x-icon" />
    {% endblock %}
    {% block scripts %}
    {% endblock %}
    <title>{% block title %} {% endblock %}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-light bg-light">
      <a class="navbar-brand " href="{{ url_for('index')}}">Oracle LiveLaps</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse topnav" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href="/about">Help</a>
          </li>
          <li class="nav-item active">
           <a class="nav-link" target="_blank" href="/leaderboard">Leaderboard</a>
          </li>
          <li class="nav-item active">
           <a class="nav-link" target="_blank" href="/registration">Registration</a>
          </li>
          <li class="nav-item active">
           <a class="nav-link" href="/circuit/svg">Circuit</a>
          </li>
          <li class="nav-item active">
           <a class="nav-link" href="/telemetry/svg">Telemetry</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="/analyser">Analyser</a>
           </li>
          <li class="nav-item active">
           <a class="nav-link" href="/rbr/rb18">ORBR</a>
          </li>
        </ul>
      </div>
  </nav>
  <div class="container-fluid">
      {% block content %} {% endblock %}
  </div>
  </body>
  </html>
